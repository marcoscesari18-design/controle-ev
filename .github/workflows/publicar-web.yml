# ---------------------------------------------------------------
# Publica a versão web (PWA) no GitHub Pages automaticamente
# sempre que a pasta web/ mudar (ou manualmente pela aba Actions).
#
# Pré-requisito (uma única vez, no site do GitHub):
#   Settings → Pages → Source: "GitHub Actions"
# O app ficará em: https://SEU_USUARIO.github.io/controle-ev/
# ---------------------------------------------------------------
name: Publicar app web

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Empacotar a pasta web/
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
